name: Build course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        required: false
        default: ""

jobs:
  build:
    name: Handouts and slides
    runs-on: ubuntu-latest
    # Full TeX Live: the course uses beamer, subfiles, pgfplots, tcolorbox,
    # algorithm2e, qrcode, xy, ... so a slim install would need a long package list.
    container: texlive/texlive:latest
    steps:
      # git must be present before checkout, otherwise actions/checkout falls
      # back to a tarball download that cannot fetch submodules. pdfinfo is
      # used by build.sh for its page-count summary.
      - name: Install git and pdfinfo
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates poppler-utils

      - name: Check out repository with submodule
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Build whole course and every chapter
        working-directory: variational-algorithms/course
        run: |
          set -o pipefail
          ./build.sh all 2>&1 | tee build-summary.txt

      - name: Verify every expected PDF was produced
        # build.sh keeps going after a failed chapter and does not exit non-zero,
        # so check its output and the resulting files ourselves.
        working-directory: variational-algorithms/course
        run: |
          status=0
          if grep -q '^FAILED:' build-summary.txt; then
            echo "::error::build.sh reported failures (see above)"; status=1
          fi
          expected="handoutsbeamer overheadsbeamer"
          for f in ch[0-9][0-9]_*.tex; do
            ch=${f%.tex}
            expected="$expected $ch slides_$ch"
          done
          for job in $expected; do
            if [ ! -s "$job.pdf" ]; then
              echo "::error::missing $job.pdf"; status=1
            fi
          done
          exit $status

      - name: Upload whole-course handout and slide deck
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-full
          path: |
            variational-algorithms/course/handoutsbeamer.pdf
            variational-algorithms/course/overheadsbeamer.pdf
          if-no-files-found: warn

      - name: Upload per-chapter handouts and slides
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-chapters
          path: |
            variational-algorithms/course/ch[0-9][0-9]_*.pdf
            variational-algorithms/course/slides_ch[0-9][0-9]_*.pdf
          if-no-files-found: warn

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: latex-logs
          path: |
            variational-algorithms/course/build/*.log
            variational-algorithms/course/build/*.blg
            variational-algorithms/course/build-summary.txt

  release:
    name: Publish PDFs as a release
    needs: build
    # Never release from pull requests; the reusable-call path (scheduled
    # submodule bump) and pushes to main both qualify.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository (submodule pointer only)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Compare submodule commit with the latest release
        id: check
        run: |
          current=$(git rev-parse HEAD:variational-algorithms)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "tag=course-${current:0:7}" >> "$GITHUB_OUTPUT"
          # Release tags are course-<submodule sha>, so the latest release
          # tells us which submodule commit was last published.
          latest_tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          previous=${latest_tag#course-}
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ -n "$latest_tag" ] && [ "${current:0:${#previous}}" = "$previous" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Latest release $latest_tag already covers submodule $current; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Latest release: ${latest_tag:-none}; publishing $current."
          fi

      - name: Download built PDFs
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: course-*
          path: pdfs
          merge-multiple: true

      - name: Create release
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          CURRENT: ${{ steps.check.outputs.current }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
          TARGET: ${{ inputs.ref || github.sha }}
        run: |
          upstream=https://github.com/jmarecek/variational-algorithms
          notes="Built from [jmarecek/variational-algorithms@${CURRENT:0:7}]($upstream/commit/$CURRENT)."
          if [ -n "$PREVIOUS" ]; then
            notes=$(printf '%s\n\nChanges since the previous release: [%s...%s](%s/compare/%s...%s)' \
              "$notes" "$PREVIOUS" "${CURRENT:0:7}" "$upstream" "$PREVIOUS" "${CURRENT:0:7}")
          fi
          gh release create "$TAG" pdfs/*.pdf \
            --target "$TARGET" \
            --title "Course PDFs ($(date -u +%Y-%m-%d), ${CURRENT:0:7})" \
            --notes "$notes"
